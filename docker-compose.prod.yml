services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guesschess
      POSTGRES_USER: ${POSTGRES_USER:-guesschess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guesschess}
    volumes:
      - guesschess-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guesschess}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

  backend:
    image: ghcr.io/deterson/guesschess-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file: /opt/guesschess/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/guesschess
      SERVER_SHUTDOWN: graceful
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 640m
    restart: unless-stopped

  frontend:
    image: ghcr.io/deterson/guesschess-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    mem_limit: 64m
    restart: unless-stopped

volumes:
  guesschess-postgres-data:
  caddy-data:
  caddy-config:
