spring.application.name=guesschess
spring.threads.virtual.enabled=true
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://35.180.147.199:5432/guesschess
spring.datasource.username=${POSTGRES_USER:guesschess}
spring.datasource.password=${POSTGRES_PASSWORD:guesschess}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=PT24H
app.oauth.post-login-redirect-uri=${OAUTH_POST_LOGIN_REDIRECT_URI:http://localhost:5173/oauth-callback}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.anonymous-cookie.secure=${ANONYMOUS_COOKIE_SECURE:false}

# Etape 15 : chemin du binaire Stockfish (protocole UCI, voir StockfishChessEngine) -
# absent/vide desactive uniquement "jouer contre l'ordinateur" (COMPUTER_UNAVAILABLE),
# sans bloquer le demarrage de l'application (voir CLAUDE.md).
guesschess.stockfish.path=${STOCKFISH_PATH:}

# Etapes 17 et 20 : version de moteur (nom@version, voir AgentRegistry/BuiltInAgents) qui joue et
# devine par niveau de "jouer contre l ordinateur". GUESSCHESS_ENGINE change tous les niveaux d un
# coup (alias historiques "minimax"/"stockfish" acceptes) ; GUESSCHESS_ENGINE_EASY/MEDIUM/HARD un
# seul. Une version inconnue fait echouer le demarrage.
guesschess.engine.default=${GUESSCHESS_ENGINE:minimax@1}
guesschess.engine.easy=${GUESSCHESS_ENGINE_EASY:${guesschess.engine.default}}
guesschess.engine.medium=${GUESSCHESS_ENGINE_MEDIUM:${guesschess.engine.default}}
guesschess.engine.hard=${GUESSCHESS_ENGINE_HARD:${guesschess.engine.default}}

# Healthcheck Docker (voir Dockerfile) : /actuator/health uniquement, rien d'autre
# n'est expose (pas de /actuator/env, /actuator/beans, etc.).
management.endpoints.web.exposure.include=health

# Etape 16 : variante par defaut proposee a la creation d'une partie quand le client
# n'en precise pas ("GUESSCHESS" ou "GUESSMATE", voir GameVariant) - changeable sans
# rebuild via la variable d'environnement DEFAULT_GAME_VARIANT (GameCreationController
# l'expose aussi en lecture via GET /api/games/default-variant pour que le frontend
# coche la case "variante Guessmate" de la modale de creation en consequence).
guesschess.default-variant=${DEFAULT_GAME_VARIANT:GUESSCHESS}

# Etape 18 : emails autorises a acceder a la page admin (/api/admin/**), separes par
# des virgules - vide par defaut (page inaccessible tant que non configure), voir
# AdminAccessService.
guesschess.admin.emails=${ADMIN_EMAILS:}
