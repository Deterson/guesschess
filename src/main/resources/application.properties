spring.application.name=guesschess
spring.threads.virtual.enabled=true
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://35.180.147.199:5432/guesschess
spring.datasource.username=${POSTGRES_USER:guesschess}
spring.datasource.password=${POSTGRES_PASSWORD:guesschess}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=PT24H
app.oauth.post-login-redirect-uri=${OAUTH_POST_LOGIN_REDIRECT_URI:http://localhost:5173/oauth-callback}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.anonymous-cookie.secure=${ANONYMOUS_COOKIE_SECURE:false}

# Healthcheck Docker (voir Dockerfile) : /actuator/health uniquement, rien d'autre
# n'est expose (pas de /actuator/env, /actuator/beans, etc.).
management.endpoints.web.exposure.include=health
