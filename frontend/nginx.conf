server {
    listen 80;
    server_name _;

    # Résolveur DNS interne de Docker + variable : nginx re-résout `backend` à l'exécution.
    # Avec un proxy_pass littéral, l'IP est figée au démarrage du conteneur et un `up -d` qui
    # recrée le backend (nouvelle IP) provoque des 502 tant que ce conteneur n'est pas redémarré.
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8080;

    root /usr/share/nginx/html;
    index index.html;

    # Contexte "Compte joueur" + creation/join de partie (GameCreationController) :
    # proxy same-origin vers le backend, pas d'appel cross-origin en prod.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Redirection OAuth2 (Spring Security) : /oauth2/authorization/{provider} et
    # /login/oauth2/code/{provider} doivent atteindre le backend directement.
    location /oauth2/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /login/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Endpoint STOMP (WebSocketConfig.java) : upgrade de connexion, timeout long car
    # la connexion reste ouverte toute la session (pas de polling, voir CLAUDE.md).
    location /ws {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    # SPA Vue Router (mode history) : toute autre route retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
